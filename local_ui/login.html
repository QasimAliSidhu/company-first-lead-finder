<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Company Finder</title>
<style>body{background:#0b1119;color:#e0eaf3;font:16px system-ui;margin:0;display:grid;min-height:100vh;place-items:center}main{width:min(380px,calc(100% - 60px));padding:30px;background:#111c29;border:1px solid #263647;border-radius:14px}h1{font-size:28px}p{color:#9cacc0;line-height:1.6}label{display:block;margin:20px 0 8px}input,button{font:inherit;border-radius:7px;padding:12px;box-sizing:border-box;width:100%}input{background:#0c1520;border:1px solid #35485e;color:white}button{margin-top:25px;background:#80e5c6;color:#072c23;border:0;font-weight:650;cursor:pointer}.error{color:#ffb5a8}</style></head>
<body><main><h1>Company Finder</h1><p>Sign in with your own account to discover companies and collect public business contacts.</p><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">Username</label><input id="username" name="username" required maxlength="64" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="256" autocomplete="current-password"><button>Sign in</button></form>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<p>No ChatGPT account is required. Accounts are created by the app owner.</p></main></body></html>
